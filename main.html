<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Main Page</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f2f7ff, #dfe9ff);
        color: #1f2a44;
      }

      .container {
        background: #ffffff;
        border-radius: 14px;
        box-shadow: 0 12px 30px rgba(31, 42, 68, 0.12);
        padding: 32px 40px;
        text-align: center;
        width: min(90vw, 420px);
      }

      h1 {
        margin-bottom: 12px;
      }

      button {
        background: #2f6feb;
        color: white;
        border: none;
        border-radius: 10px;
        padding: 12px 22px;
        font-size: 1rem;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      button:hover {
        background: #2357c8;
      }

      #output {
        margin-top: 18px;
        font-size: 1.05rem;
        min-height: 24px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Website Demo</h1>
      <button id="greetBtn" type="button">Click Me</button>
      <p id="output">Waiting for action...</p>
    </div>

    <script src="maincode.js"></script>
  </body>
</html>
